<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>20 Vision Site Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>/*
VOICE: plain, firm site-supervisor talk; big targets for gloved hands.
IDEA: a hi-vis field binder — tabbed sheets, tags, stamps.
PICTURE: the working app itself; today's site card with a GPS stamp up top.
COLOUR and TYPE: white paper, ink black, safety orange lead, hi-vis lime support, red for stop. Barlow Condensed + Barlow.
LAYOUT: one column on phones, bottom tab bar; two columns from 900px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4f3ef,#121212);--card:light-dark(#ffffff,#1d1d1d);--ink:light-dark(#151515,#f2f2f2);--mute:light-dark(#5d5d5d,#a9a9a9);
--line:light-dark(#dedbd2,#333);--or:#ff6a00;--or2:light-dark(#c24f00,#ff8a3d);--lime:#c8f031;--red:#d62828;--grn:#1f9d55;--amb:#e0a100}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;line-height:1.05;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px);font-weight:800}h2{font-size:26px;font-weight:700}h3{font-size:20px;font-weight:700}
a{color:var(--or2)}
header.top{position:sticky;top:0;z-index:5;background:#151515;color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px);padding-top:calc(10px + env(safe-area-inset-top));border-bottom:6px solid var(--or)}
header.top .logo{font:800 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.5px}
header.top .logo b{color:var(--or)}
header.top .who{margin-left:auto;font-size:14px;color:#ccc;text-align:right}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px)}
.grid{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{background:var(--card);border-radius:16px;border:2px solid var(--ink);overflow:hidden}
.hero .stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--or) 0 18px,#151515 18px 36px)}
.hero .in{padding:18px}
.stamp{display:inline-flex;gap:8px;align-items:center;border:2px dashed light-dark(#137a40,var(--grn));color:light-dark(#137a40,var(--grn));border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px}
.stamp.bad{border-color:var(--red);color:var(--red)}
.mute{color:var(--mute)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 16px Barlow,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--or);border-color:var(--or);color:#111}
.btn.dark{background:#151515;color:#fff;border-color:#151515}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:92px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font:700 19px 'Barlow Condensed',sans-serif}
.tile span{font-size:13px;color:var(--mute)}
.tile.hot{border:2px solid var(--or)}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:16px Barlow,sans-serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:90px}
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.chk .ref{font-size:12px;color:var(--mute)}
.pfn{display:flex;gap:6px}
.pfn button{min-width:52px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 14px Barlow,sans-serif;cursor:pointer}
.pfn button.on.y{background:var(--grn);color:#fff;border-color:var(--grn)}
.pfn button.on.n{background:var(--red);color:#fff;border-color:var(--red)}
.pfn button.on.na{background:#777;color:#fff;border-color:#777}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:42px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--line);white-space:nowrap}
.pill.ok{background:#d7f5e3;color:#0d5c31}.pill.bad{background:#fbd5d5;color:#8a1111}.pill.warn{background:#fff0c2;color:#6b4d00}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .m{flex:1}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph{border:2px dashed var(--line);border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:6px;cursor:pointer;position:relative;overflow:hidden;background:var(--bg)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.done{border-style:solid;border-color:var(--grn)}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
canvas.sig{width:100%;height:160px;border:1.5px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
nav.tabs{position:fixed;left:0;right:0;bottom:30px;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;color:var(--mute);font:600 12px Barlow,sans-serif;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button.on{color:var(--or2)}
nav.tabs svg{width:24px;height:24px}
.ticker{position:fixed;left:0;right:0;bottom:0;height:30px;background:var(--or);color:#111;font-weight:700;overflow:hidden;white-space:nowrap;z-index:7;font-size:14px;line-height:30px}
.ticker span{display:inline-block;padding-left:100%;animation:tk 60s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:12px}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#151515;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;font-weight:600;max-width:90vw}
.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.warnbox{border-left:6px solid var(--red);background:light-dark(#fff3f3,#2a1414);padding:12px 14px;border-radius:8px}
.infobox{border-left:6px solid var(--or);background:light-dark(#fff6ee,#2a1d12);padding:12px 14px;border-radius:8px}
.okbox{border-left:6px solid var(--grn);background:light-dark(#eefaf3,#12241a);padding:12px 14px;border-radius:8px}
.kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.authwrap{max-width:440px;margin:6vh auto}
.big{font:800 clamp(34px,8vw,56px)/1 'Barlow Condensed',sans-serif}
@media print{header.top,nav.tabs,.ticker,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:1px solid #999}}

body.pdfmode #rec{background:#fff;color:#000;padding:8px;width:760px}body.pdfmode #rec .card,body.pdfmode #rec .hero{background:#fff;color:#000;border-color:#999}body.pdfmode #rec .mute{color:#444}

.chkline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;cursor:pointer}.chkline input{width:20px;height:20px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="ticker" aria-hidden="true"><span id="tk"></span></div>
<script src="qr.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator&&!window.Capacitor)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
